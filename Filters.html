<div class="filters">
    <button
    id="filtersToggle"
    class="filters-toggle"
    type="button"
    aria-expanded="true"
    aria-controls="filtersContent">
		<div class="filters-toggle-content">
			<div class="filters-toggle-title">
				Filtres
			</div>
			<div
				id="filtersSummary"
				class="filters-summary">
			</div>
		</div>
		<span class="filters-toggle-icon">▼</span>
	</button>
	<div id="filtersContent">
		<div class="filters-grid">
			<div class="filter-group">
				<label>Catégories</label>
				<div id="filterCategories"></div>
			</div>

			<div class="filter-group">
				<label>Portées</label>
				<div id="filterScopes"></div>
			</div>

			<div class="filter-group">
				<label>Types</label>
				<div id="filterTypes"></div>
			</div>

			<div class="filter-group">
				<label>Préférences</label>

				<label class="checkbox-label">
					<input
						id="showFinished"
						type="checkbox">
					<span>
						Afficher les compétitions terminées
					</span>
				</label>
			</div>
		</div>
	</div>
</div>
