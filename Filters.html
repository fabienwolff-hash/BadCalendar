<div class="filters">
    <button
    id="filtersToggle"
    class="filters-toggle"
    type="button"
    aria-expanded="true"
    aria-controls="filtersContent">
		<div class="filters-toggle-title">
				Filtres
		</div>
		<span class="filters-toggle-icon">▼</span>
	</button>
	 <div
        id="filtersSummary"
        class="filters-summary">
    </div>
	<div id="filtersContent">
		<div class="filters-grid">
			<div class="filter-group">
				<label>Catégories</label>
				<div id="filterCategories" class="filter-options"></div>
			</div>

			<div class="filter-group">
				<label>Niveau de compétition</label>
				<div id="filterScopes" class="filter-options"></div>
			</div>

			<div class="filter-group">
				<label>Type d'évènement</label>
				<div id="filterTypes" class="filter-options"></div>
			</div>

			<div class="filter-group">
				<label>Préférences</label>

				<label class="checkbox-label">
					<input
						id="showFinished"
						type="checkbox">
					<span>
						Afficher les compétitions terminées
					</span>
				</label>
				
				<label class="checkbox-label">
					<input
						id="showNewOnly"
						type="checkbox">
					<span>
						Afficher uniquement les nouveaux tournois
					</span>
				</label>

				<label class="checkbox-label">
				    <input
				        id="showOpenRegistrationOnly"
				        type="checkbox">

				    <span>
				        Afficher uniquement les inscriptions ouvertes
				    </span>
				</label>
			</div>
		</div>
	</div>
</div>
