<script>

function eventCard(event, isFeatured=false){

return `

<div class="card ${isFeatured ? "featured" : ""}">

<div class="badge ${event.type.toLowerCase()}">${event.type}</div>

<h2>${event.title}</h2>

<div class="info">📅 ${formatDate(event.startDate,event.endDate)}</div>

<div class="info">📍 ${event.location}</div>

<div class="info">👦 ${event.category}</div>

<div class="info">📝 ${event.registrationType}</div>

${registrationButton(event)}

</div>

`;

}

</script>
