<div class="filters">
    <button
    id="filtersToggle"
    class="filters-toggle"
    type="button"
    aria-expanded="true"
    aria-controls="filtersContent">
		<div class="filters-toggle-content">
			<div class="filters-toggle-title">
				Filtres
			</div>
			<div
				id="filtersSummary"
				class="filters-summary">
			</div>
		</div>
		<span class="filters-toggle-icon">▼</span>
	</button>

    <div id="filtersContent">
		<div class="filter-group">
			<label for="search">Recherche</label>
			<input id="search" placeholder="Rechercher...">
		</div>

		<div class="filter-group">
			<label for="filterType">Type</label>
			<select id="filterType"></select>
		</div>

		<div class="filter-group">
			<label for="filterScope">Portée</label>
			<select id="filterScope"></select>
		</div>

		<div class="filter-group">
			<label for="filterCategory">Catégorie</label>
			<select id="filterCategory"></select>
		</div>

		<div class="filter-group">
			<label for="filterMonth">Mois</label>
			<select id="filterMonth"></select>
		</div>
		
		<hr class="filters-separator">

		<label class="checkbox-label" for="showFinished">

			<input
				id="showFinished"
				type="checkbox">

			<span>Afficher les compétitions terminées</span>

		</label>
	</div>
</div>
