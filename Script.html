<script>

const UI = {
    FILTER_ALL: "Tous",
    EMPTY_MESSAGE: "Aucun événement trouvé.",
    SEARCH_PLACEHOLDER: "Rechercher..."
};

const DOM = {
    SEARCH: "search",
    FILTER_TYPE: "filterType",
    FILTER_CATEGORY: "filterCategory",
    FILTER_MONTH: "filterMonth",
    EVENTS: "events"
};

const App = {

    events: [],

    state: {
        search: "",
        type: UI.FILTER_ALL,
        category: UI.FILTER_ALL,
        month: UI.FILTER_ALL
    },

    init(events) {

        this.events = events;
		
		console.log("Events chargés :", this.events);

        this.populateFilters();

        this.bindEvents();

        this.render();

    },

    populateFilters() {

        fillSelect(
            DOM.FILTER_TYPE,
            [...new Set(this.events.map(e => e.type))].sort()
        );

fillSelect(
	DOM.FILTER_CATEGORY,
    [...new Set(this.events.flatMap(e => e.categories))].sort()
);

fillSelect(
	DOM.FILTER_MONTH,
    [...new Set(this.events.map(e => e.month))]
);

    },

    bindEvents() {

       $(DOM.SEARCH)
            .addEventListener("input", e => {
                this.state.search = e.target.value;
                this.render();
            });

        $(DOM.FILTER_TYPE)
            .addEventListener("change", e => {
                this.state.type = e.target.value;
                this.render();
            });

        $(DOM.FILTER_CATEGORY)
            .addEventListener("change", e => {
                this.state.category = e.target.value;
                this.render();
            });

        $(DOM.FILTER_MONTH)
            .addEventListener("change", e => {
                this.state.month = e.target.value;
                this.render();
            });

    },

    getFilteredEvents() {

        return this.events.filter(event => {

            if (this.state.type !== UI.FILTER_ALL
                && event.type !== this.state.type)
                return false;

            if (
    this.state.category !== UI.FILTER_ALL &&
    !event.categories.includes(this.state.category)
)
    return false;

if (
    this.state.month !== UI.FILTER_ALL &&
    event.month !== this.state.month
)
    return false;

            if (this.state.search !== "") {

                const txt = (

                    event.title +
                    " " +
                    event.location +
                    " " +
                    event.category +
                    " " +
                    event.type

                ).toLowerCase();

                if (!txt.includes(
                    this.state.search.toLowerCase()
                )) {

                    return false;

                }

            }

            return true;

        });

    },

   render(){

    renderEvents(this.getFilteredEvents());

}

};

function fillSelect(id, values) {
    const select = document.getElementById(id);
    select.innerHTML = "<option>Tous</option>";
    values.forEach(value => {
        select.innerHTML +=
            `<option>${value}</option>`;
    });
}

function $(id){
    return document.getElementById(id);
}

google.script.run

    .withSuccessHandler(App.init.bind(App))

    .readEvents();

</script>
