<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#EEF2F6;
    font-family:Arial,Helvetica,sans-serif;
    color:#333;
    line-height:1.45;
	min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

/* =========================
   INITIALIZATION
========================= */

.hidden{
    display:none;
}

#loading{
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:24px;
}

/* display uniquement lorsque l'écran est visible */
#loading:not(.hidden){
    display:flex;
}

.loading-content{
    text-align:center;
    max-width:320px;
}

.loading-logo{
    width:72px;
    margin-bottom:20px;
}

.loading-text{
    margin-top:24px;
    color:#666;
    font-size:15px;
}

#error{
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:24px;
}

#error:not(.hidden){
    display:flex;
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:white;
    padding:12px 16px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    border-bottom:1px solid #eee;
}

header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:.2px;
}

.header-logo{
    height:34px;
    vertical-align:middle;
    margin-right:10px;
}

/* =========================
   FILTERS
========================= */

.filters{
    position:sticky;
    top:66px;
    z-index:999;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:10px 16px;
    background:white;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
    border-bottom:1px solid #eee;
}

.filters select,
.filters input{
    width:100%;
    padding:10px 12px;
    border:1px solid #d9d9d9;
    border-radius:12px;
    font-size:14px;
    background:white;
    transition:border-color .2s,
	box-shadow .2s;
}

.filters select:focus,
.filters input:focus{
    outline:none;
    border-color:#1976D2;
    box-shadow:0 0 0 3px rgba(25,118,210,.12);
}

.filter-group{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.filter-group label{
    font-size:12px;
    font-weight:600;
    color:#666;
    margin-left:4px;
}

.filters-toggle{
	display:flex;
	justify-content:space-between;
	align-items:center;

	width:100%;
	padding:10px 0;
	background:none;
	border:none;

	cursor:pointer;

	font-size:15px;
	font-weight:600;
}

.filters-toggle-content{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.filters-toggle-title{
    font-weight:600;
}

.filters-summary{
    margin-top:2px;
    font-size:12px;
    color:#666;
}
	
#filtersContent{
    display:grid;
    grid-template-rows:1fr;
    overflow:hidden;

}
	
#filtersContent.collapsed{
    display:none;
}

.filters-separator{
    margin:12px 0 8px;
    border:none;
    border-top:1px solid #E5E7EB;
}

.checkbox-label{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;

    width:fit-content;

    font-size:14px;
    color:#333;
}

.checkbox-label input{
    width:auto;
    height:auto;
    margin:0;
    padding:0;
    border:none;
    flex:none;
}

/* =========================
   EVENTS CONTAINER
========================= */

#events{
    padding:16px;
}

/* =========================
   SECTION TITLES (mois)
========================= */

.month-header{
    margin:20px 4px 10px;
    padding-bottom:8px;
    border-bottom:2px solid #e0e0e0;
    font-size:18px;
    font-weight:700;
    color:#1565C0;
    letter-spacing:.3px;
}

/* =========================
   CARD
========================= */

.card{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.10);
    transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid rgba(0,0,0,.04);
}

.card .button + .button {
    margin-top: 8px;
}

.card-ongoing{
    border-left:5px solid #43A047;
}

.card-finished{
    background:#ECEFF1;
    border-left:5px solid #90A4AE;
}

.card-details{
    display:none;
}

.card.expanded .card-details{
    display:block;
}

.secondary-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.secondary-actions .button{
    flex:1;
    margin-top:0;
    padding:8px 10px;
    font-size:13px;
}

@media (hover:hover){
    .card:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 26px rgba(0,0,0,.14);
    }
}

/* =========================
   CARD HEADER
========================= */

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;

}

.title-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.event-date{
    color:#546E7A;
    font-size:13px;
    font-weight:700;
}

.event-title{
    margin:0;
    font-size:20px;
    line-height:1.3;
}

/* =========================
   SEPARATOR
========================= */

.separator{
    height:1px;
    background:#ECEFF1;
    margin:12px 0;
	opacity:.4;
}

/* =========================
   REGISTRATION
========================= */

.registration{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
    font-size:14px;
}

.registration-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    flex-shrink:0;
}

.registration-open{
    background:#4CAF50;
}

.registration-not-open{
    background:#FB8C00;
}

.registration-closed{
    background:#616161;
}

/* =========================
   BADGES — PALETTE HARMONISÉE 3.4
========================= */

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:999px;
    color:white;
    font-size:10px;
	text-transform:uppercase;
    font-weight:600;
    letter-spacing:.2px;
    margin-bottom:0;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
}

/* Formation */
.stage{
    background:#FFB300; /* amber 600 */
    color:#1A1A1A;
}

/* Jeunes compétitions (famille bleue cohérente) */
.tdj{
    background:#1E88E5;
}

.tij{
    background:#42A5F5;
}

.trj{
    background:#1565C0;
}

/* Loisirs / initiation */
.promobad{
    background:#43A047;
}

/* Interclubs */
.interclub{
    background:#546E7A;
}

/* Championnat */
.championnat{
    background:#EF6C00;
}

/* CDJ */
.cdj{
    background:#00897B;
}

/* =========================
   ACCESSIBILITÉ (option importante)
========================= */

.badge{
    text-shadow:0 1px 1px rgba(0,0,0,.15);
}

/* =========================
   INFO TEXT
========================= */

.info{
    margin:8px 0;
    font-size:14px;
    color:#424242;
}

/* =========================
   BUTTON
========================= */

.button{
    display:block;
    margin-top:16px;
    text-align:center;
    text-decoration:none;
    padding:12px;
    border-radius:12px;
    background:#1976D2;
    color:white;
    font-weight:600;
    transition:background .2s ease, transform .1s ease;
	cursor:pointer;
}

.button:hover{
    background:#1565C0;
    transform:translateY(-1px);
}

.button-primary{
    background:#1976D2;
}

.button-secondary{
    background:#ECEFF1;
    color:#455A64;
	padding:8px 12px;
	font-size:13px;
}

.card-toggle{
    margin-top:12px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#ECEFF1;
    color:#424242;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.card-toggle:hover{
    background:#E0E0E0;
}


/* =========================
   EMPTY STATE (No results found)
========================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#666;
}

.empty .button{
    display:inline-block;
    width:auto;
    min-width:220px;
}

/* =========================
   3.5 — RESPONSIVE IMPROVEMENTS
========================= */

/* --- Mobile (optimisation principale) --- */
@media (max-width: 600px){

    body{
        padding:0;
    }

    #events{
        padding:12px;
    }

    .card{
        border-radius:16px;
        padding:14px;
        margin-bottom:12px;
    }

    /* Boutons pleine largeur sur mobile */
    .button{
        width:100%;
    }

    .filters{
        padding:12px;
        gap:8px;
    }

	.filters select,
	.filters input:not([type="checkbox"]){
        font-size:14px;
        padding:11px;
    }
	
    .month-header{
        font-size:16px;
        margin:20px 2px 10px;
    }
	
	
}

/* --- Tablette --- */
@media (min-width: 601px) and (max-width: 899px){

    body{
        max-width:600px;
        margin:auto;
    }

    #events{
        padding:14px;
    }

    .card{
        padding:16px;
    }

    /* boutons un peu plus confortables */
    .button{
        width:auto;
        min-width:180px;
    }
}

/* --- Desktop --- */
@media (min-width:900px){

    body{
        max-width:720px;
        margin:auto;
    }

    .card{
        padding:18px;
    }

    .button{
        width:auto;
    }

}

/* --- Sécurité UX : éviter les débordements --- */
.card,
.info,
.badge{
    word-break:break-word;
    overflow-wrap:anywhere;
}



</style>
