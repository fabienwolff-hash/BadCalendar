<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#EEF2F6;
    font-family:Arial,Helvetica,sans-serif;
    color:#333;
    line-height:1.45;
	min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:white;
    padding:12px 16px;
    box-shadow:0 4px 14px rgba(0,0,0,.08);
    border-bottom:1px solid #eee;
}

header h1{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:.2px;
}

.header-logo{
    height:34px;
    vertical-align:middle;
    margin-right:10px;
}

/* =========================
   FILTERS
========================= */

.filters{
    position:sticky;
    top:66px;
    z-index:999;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:10px 16px;
    background:white;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
    border-bottom:1px solid #eee;
}

.filters select,
.filters input{
    width:100%;
    padding:10px 12px;
    border:1px solid #d9d9d9;
    border-radius:12px;
    font-size:14px;
    background:white;
    transition:border-color .2s,
	box-shadow .2s;
}

.filters select:focus,
.filters input:focus{
    outline:none;
    border-color:#1976D2;
    box-shadow:0 0 0 3px rgba(25,118,210,.12);
}

.filter-group{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.filter-group label{
    font-size:12px;
    font-weight:600;
    color:#666;
    margin-left:4px;
}

/* =========================
   EVENTS CONTAINER
========================= */

#events{
    padding:16px;
}

/* =========================
   SECTION TITLES (mois)
========================= */

.month-header{
    margin:20px 4px 10px;
    padding-bottom:8px;
    border-bottom:2px solid #e0e0e0;
    font-size:18px;
    font-weight:700;
    color:#1565C0;
    letter-spacing:.3px;
}

/* =========================
   CARD (amélioration principale)
========================= */

.card{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.10);
    transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid rgba(0,0,0,.04);
}

@media (hover:hover){
    .card:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 26px rgba(0,0,0,.14);
    }
}

/* =========================
   CARD HEADER
========================= */

.card-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:12px;

}

.event-date{

    color:#757575;

    font-size:13px;

    font-weight:600;

}

.event-title{

    margin:0 0 14px;

    font-size:20px;

    line-height:1.3;

}

/* =========================
   SEPARATOR
========================= */

.separator{

    height:1px;

    background:#ECEFF1;

    margin:14px 0;

}

/* =========================
   REGISTRATION
========================= */

.registration{

    color:#616161;

    font-size:14px;

    margin-bottom:14px;

    line-height:1.4;

}

/* =========================
   BADGES — PALETTE HARMONISÉE 3.4
========================= */

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:999px;
    color:white;
    font-size:11px;
	text-transform:uppercase;
    font-weight:600;
    letter-spacing:.2px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
}

/* Formation */
.stage{
    background:#FFB300; /* amber 600 */
    color:#1A1A1A;
}

/* Jeunes compétitions (famille bleue cohérente) */
.tdj{
    background:#1E88E5;
}

.tij{
    background:#42A5F5;
}

.trj{
    background:#1565C0;
}

/* Loisirs / initiation */
.promobad{
    background:#43A047;
}

/* Interclubs */
.interclub{
    background:#546E7A;
}

/* Championnat */
.championnat{
    background:#EF6C00;
}

/* CDJ */
.cdj{
    background:#00897B;
}

/* =========================
   ACCESSIBILITÉ (option importante)
========================= */

.badge{
    text-shadow:0 1px 1px rgba(0,0,0,.15);
}

/* =========================
   INFO TEXT
========================= */

.info{
    margin:8px 0;
    font-size:14px;
    color:#424242;
}

/* =========================
   BUTTON
========================= */

.button{
    display:block;
    margin-top:16px;
    text-align:center;
    text-decoration:none;
    padding:12px;
    border-radius:12px;
    background:#1976D2;
    color:white;
    font-weight:600;
    transition:background .2s ease, transform .1s ease;
	cursor:pointer;
}

.button:hover{
    background:#1565C0;
    transform:translateY(-1px);
}


/* =========================
   EMPTY STATE
========================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#666;
}

/* =========================
   3.5 — RESPONSIVE IMPROVEMENTS
========================= */

/* --- Mobile (optimisation principale) --- */
@media (max-width: 600px){

    body{
        padding:0;
    }

    #events{
        padding:12px;
    }

    .card{
        border-radius:16px;
        padding:14px;
        margin-bottom:12px;
    }

    /* Boutons pleine largeur sur mobile */
    .button{
        width:100%;
    }

    .filters{
        padding:12px;
        gap:8px;
    }

    .filters select,
    .filters input{
        font-size:14px;
        padding:11px;
    }
	
	.filters-toggle{
		display:flex;
		justify-content:space-between;
		align-items:center;

		width:100%;

		padding:10px 0;

		background:none;
		border:none;

		cursor:pointer;

		font-size:15px;
		font-weight:600;
	}
	
	#filtersContent{
		overflow:hidden;
		max-height:600px;
		transition:max-height .25s ease;
	}
	
	#filtersContent.collapsed{
		max-height:0;
	}

    .month-header{
        font-size:16px;
        margin:20px 2px 10px;
    }
}

/* --- Tablette --- */
@media (min-width: 601px) and (max-width: 899px){

    body{
        max-width:600px;
        margin:auto;
    }

    #events{
        padding:14px;
    }

    .card{
        padding:16px;
    }

    /* boutons un peu plus confortables */
    .button{
        width:auto;
        min-width:180px;
    }
}

/* --- Desktop --- */
@media (min-width:900px){

    body{
        max-width:720px;
        margin:auto;
    }

    .card{
        padding:18px;
    }

    .button{
        width:auto;
    }

}

/* --- Sécurité UX : éviter les débordements --- */
.card,
.info,
.badge{
    word-break:break-word;
    overflow-wrap:anywhere;
}



</style>
