<script>
const DEBUG = {
    SIMULATE_INIT_ERROR: false
};

const Storage = {

    loadFiltersCollapsed() {
        return localStorage.getItem(STORAGE_KEYS.FILTERS_COLLAPSED) === "true";
    },

    saveFiltersCollapsed(value) {
        localStorage.setItem(STORAGE_KEYS.FILTERS_COLLAPSED,value);
    },

    loadShowFinished() {
        return localStorage.getItem(STORAGE_KEYS.SHOW_FINISHED) === "true";
    },

    saveShowFinished(value) {
        localStorage.setItem(STORAGE_KEYS.SHOW_FINISHED,value);
    }
};

const App = {

    events: [],

    state: {
        search: "",
		type: UI.FILTERS.ALL,
		category: UI.FILTERS.ALL,
		scope: UI.FILTERS.ALL,
		month: UI.FILTERS.ALL,
		filtersCollapsed: false,
		showFinished: false
    },

    init(events) {

        this.events = events;
		
		console.table(
			this.events.map(e => ({
				title: e.title,
				eventStatus: e.eventStatus,
				registrationStatus: e.registrationStatus
			}))
		);
		
		this.initialize();
    },
	
	initialize() {

		this.populateFilters();

		this.restoreState();

		this.bindEvents();

		this.render();

		this.showApplication();

	},
	
	restoreState() {
		this.state.filtersCollapsed =  Storage.loadFiltersCollapsed();
		this.state.showFinished = Storage.loadShowFinished();
		$(DOM.SHOW_FINISHED).checked = this.state.showFinished;
	},

    populateFilters() {

        fillSelect(
            DOM.FILTER_TYPE,
            [...new Set(this.events.map(e => e.type))].sort()
        );

		fillSelect(
			DOM.FILTER_CATEGORY,sortByOrder(
			[...new Set(this.events.flatMap(e => e.categoriesArray))],
			ORDER.CATEGORIES)
		);
		
		fillSelect(
			DOM.FILTER_SCOPE,sortByOrder(
			[...new Set(this.events.map(e => e.scope))],
			ORDER.SCOPES)
		);

		fillSelect(
			DOM.FILTER_MONTH,
			[...new Set(this.events.map(e => e.month))]
		);

    },

    bindEvents() {

       $(DOM.SEARCH)
            .addEventListener("input", e => {
                this.state.search = e.target.value;
                this.render();
            });

        $(DOM.FILTER_TYPE)
            .addEventListener("change", e => {
                this.state.type = e.target.value;
                this.render();
            });

        $(DOM.FILTER_CATEGORY)
            .addEventListener("change", e => {
                this.state.category = e.target.value;
                this.render();
            });
			
		$(DOM.FILTER_SCOPE)
			.addEventListener("change", e => {
				this.state.scope = e.target.value;
				this.render();
			});	

        $(DOM.FILTER_MONTH)
            .addEventListener("change", e => {
                this.state.month = e.target.value;
                this.render();
            });

		$(DOM.FILTERS_TOGGLE)
			.addEventListener("click", () => {

				this.state.filtersCollapsed =
					!this.state.filtersCollapsed;

				Storage.saveFiltersCollapsed(this.state.filtersCollapsed);
				
				this.render();
			});
			
		$(DOM.SHOW_FINISHED)
			.addEventListener("change", e => {
				this.state.showFinished = e.target.checked;
				Storage.saveShowFinished(this.state.showFinished);

				this.render();
			});	
    },

    getFilteredEvents() {

        return this.events.filter(event => {

            if (this.state.type !== UI.FILTERS.ALL
                && event.type !== this.state.type)
                return false;

            if (this.state.category !== UI.FILTERS.ALL 
				&& !event.categoriesArray.includes(this.state.category))
				return false;
				
			if (this.state.scope !== UI.FILTERS.ALL &&
				event.scope !== this.state.scope){
					return false;
				}

			if (this.state.month !== UI.FILTERS.ALL &&
				event.month !== this.state.month)
					return false;

			if (!this.state.showFinished &&
				event.eventStatus === STATUS.EVENT.FINISHED){
					return false;
				}

            if (this.state.search !== "") {
                const txt = (
                    event.title +
                    " " +
                    event.location +
                    " " +
                    event.categories +
						" " +
                    event.type
                ).toLowerCase();

                if (!txt.includes(
                    this.state.search.toLowerCase()
                )) {
                    return false;
                }
            }
            return true;
        });
    },

	getFiltersSummary() {

		const summary = [];

		if (this.state.search !== "") {
			summary.push(`Recherche : ${this.state.search}`);
		}

		if (this.state.type !== UI.FILTERS.ALL) {
			summary.push(this.state.type);
		}

		if (this.state.scope !== UI.FILTERS.ALL) {
			summary.push(this.state.scope);
		}

		if (this.state.category !== UI.FILTERS.ALL) {
			summary.push(this.state.category);
		}

		if (this.state.month !== UI.FILTERS.ALL) {
			summary.push(this.state.month);
		}

		return summary;

	},

   render(){
   
		this.updateFiltersUI();
   
		renderEvents(this.getFilteredEvents());
	},
	
	updateFiltersUI() {

		const filtersContent = $(DOM.FILTERS_CONTENT);
		const toggle = $(DOM.FILTERS_TOGGLE);

		filtersContent.classList.toggle(
			"collapsed",
			this.state.filtersCollapsed
		);

		toggle.setAttribute(
			"aria-expanded",
			String(!this.state.filtersCollapsed)
		);

		toggle.querySelector(".filters-toggle-icon").textContent =
			this.state.filtersCollapsed ? "▶" : "▼";

		const summary = this.getFiltersSummary();
		const summaryElement = $(DOM.FILTERS_SUMMARY);

		if (summary.length === 0) {
			summaryElement.textContent = UI.MESSAGES.NO_FILTER;
		} else {
			summaryElement.textContent = summary.join(" • ");
		}

		summaryElement.style.display =
			this.state.filtersCollapsed
				? "block"
				: "none";
	},
	
	
	resetFilters(){

		this.state.search = "";
		this.state.type = UI.FILTERS.ALL;
		this.state.scope = UI.FILTERS.ALL;
		this.state.category = UI.FILTERS.ALL;
		this.state.month = UI.FILTERS.ALL;

		this.state.filtersCollapsed = false;

		$(DOM.SEARCH).value = "";

		$(DOM.FILTER_TYPE).value = UI.FILTERS.ALL;
		$(DOM.FILTER_SCOPE).value = UI.FILTERS.ALL;
		$(DOM.FILTER_CATEGORY).value = UI.FILTERS.ALL;
		$(DOM.FILTER_MONTH).value = UI.FILTERS.ALL;

		this.state.filtersCollapsed = false;
		this.state.showFinished = false;

		$(DOM.SHOW_FINISHED).checked = false;

		Storage.saveFiltersCollapsed(this.state.filtersCollapsed);
		Storage.saveShowFinished(this.state.showFinished);

		this.render();
	},
	
	showApplication(){
	
		$(DOM.LOADING)
			.classList.add("hidden");

		$(DOM.APP)
			.classList.remove("hidden");
	},
	
	showError(){
		$(DOM.LOADING)
			.classList.add("hidden");

		$(DOM.APP)
			.classList.add("hidden");

		$(DOM.ERROR)
			.classList.remove("hidden");
	},
	
	initError(error){
		this.showError();
	}
};

function fillSelect(id, values) {
    const select = document.getElementById(id);
    select.innerHTML = `<option>${UI.FILTERS.ALL}</option>`;
    values.forEach(value => {
        select.innerHTML +=
            `<option>${value}</option>`;
    });
}

function sortByOrder(values, order){

    return [...values].sort((a, b) => {

        const ia = order.indexOf(a);
        const ib = order.indexOf(b);

        if(ia === -1 && ib === -1){
            return a.localeCompare(b);
        }

        if(ia === -1){
            return 1;
        }

        if(ib === -1){
            return -1;
        }

        return ia - ib;

    });

}

function $(id){
    return document.getElementById(id);
}
if (DEBUG.SIMULATE_INIT_ERROR) {

    App.initError(
        new Error("Erreur simulée")
    );

} else {
	google.script.run
		.withSuccessHandler(App.init.bind(App))
		.withFailureHandler(App.initError.bind(App))
		.readEvents();
}
</script>
