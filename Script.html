<script>

const App = {

    events: [],

    state: {
        search: "",
        type: "Tous",
        category: "Tous",
        month: "Tous"
    },

    init(events) {

        this.events = events;

        this.populateFilters();

        this.bindEvents();

        this.render();

    },

    populateFilters() {

        fillSelect(
            "filterType",
            [...new Set(this.events.map(e => e.type))].sort()
        );

       fillSelect(
    "filterCategory",
    [...new Set(this.events.map(e => e.category))].sort()
);

fillSelect(
    "filterMonth",
    [...new Set(
        this.events.map(e =>
            new Date(e.startDate).toLocaleString("fr-FR", {
                month: "long"
            })
        )
    )]
);

    },

    bindEvents() {

        document
            .getElementById("search")
            .addEventListener("input", e => {

                this.state.search = e.target.value;

                this.render();

            });

        document
            .getElementById("filterType")
            .addEventListener("change", e => {

                this.state.type = e.target.value;

                this.render();

            });

        document
            .getElementById("filterCategory")
            .addEventListener("change", e => {

                this.state.category = e.target.value;

                this.render();

            });

        document
            .getElementById("filterMonth")
            .addEventListener("change", e => {

                this.state.month = e.target.value;

                this.render();

            });

    },

    getFilteredEvents() {

        return this.events.filter(event => {

            if (this.state.type !== "Tous"
                && event.type !== this.state.type)
                return false;

            if (this.state.category !== "Tous"
				&& event.category !== this.state.category)
				return false;

            const month = new Date(event.startDate).toLocaleString("fr-FR", {
    month: "long"
});

if (this.state.month !== "Tous"
    && month !== this.state.month)
    return false;

            if (this.state.search !== "") {

                const txt = (

                    event.title +
                    " " +
                    event.location +
                    " " +
                    event.category +
                    " " +
                    event.type

                ).toLowerCase();

                if (!txt.includes(
                    this.state.search.toLowerCase()
                )) {

                    return false;

                }

            }

            return true;

        });

    },

    render() {

        const container =
            document.getElementById("events");

        container.innerHTML = "";

        this.getFilteredEvents()

            .forEach(event => {

                container.innerHTML +=
                    renderCard(event);

            });

    }

};

function fillSelect(id, values) {

    const select = document.getElementById(id);

    select.innerHTML = "<option>Tous</option>";

    values.forEach(value => {

        select.innerHTML +=
            `<option>${value}</option>`;

    });

}

google.script.run

    .withSuccessHandler(events => {

        App.init(events);

    })

    .readEvents();

</script>
