<script>

function renderCard(event) {

    const registrationInfo = getRegistrationMessage(event);
	
	let cardClass = "";

	if (event.eventStatus === STATUS.EVENT.FINISHED) {
		cardClass = "card-finished";
	}
	else if (event.eventStatus === STATUS.EVENT.ONGOING) {
		cardClass = "card-ongoing";
	}

    return `

<div class="card ${cardClass}">

	<div class="card-summary">
		<div class="card-header">
			<div class="card-header-left">

				<div class="badge ${event.type.toLowerCase()}">
					${event.type}
				</div>
				
				<h2 class="event-title">
					${event.title}
				</h2>
			</div>
			
			<div class="event-date">
				${event.displayDate}
			</div>
		</div>
		

		<div class="info">
			📍 ${event.displayLocation}
		</div>

		<div class="info">
			👦 ${event.categoriesArray.join(" • ")}
		</div>
		
		${event.disciplinesArray.length > 0 ? `
		<div class="info">
			🏸 ${event.disciplinesArray.join(" • ")}
		</div>
		` : ""}

		<div class="separator"></div>

		${registrationInfo ? `
		<div class="registration">
			📝 ${registrationInfo}
		</div>
		` : ""}

		<button 
			class="card-toggle"
			type="button">

			Voir les détails ▼

		</button>


	</div>
	<div class="card-details">

		<div class="info">
			👥 ${event.registrationMode}
		</div>
		
		${eventButton(event)}
		
		${googleMapsButton(event)}
		
		${googleCalendarButton(event)}
	</div>
</div>

`;

}

function renderMonthHeader(month, year){

    return `

<h2 class="month-header">

${month.charAt(0).toUpperCase()+month.slice(1)} ${year}

</h2>

`;

}

function renderEvents(events){

    const container=document.getElementById("events");
	
	if (events.length === 0) {

    container.innerHTML = `
        <div class="empty">
            <p>${UI.MESSAGES.EMPTY}</p>

            <button
                id="resetFilters"
                class="button"
                type="button">

                ${UI.BUTTONS.RESET_FILTERS}

            </button>
        </div>
    `;

    document
        .getElementById("resetFilters")
        .addEventListener("click", () => App.resetFilters());

    return;
	}

    let html="";

    let currentGroup="";

    events.forEach(event=>{

        const group=event.year+"-"+event.monthNumber;

        if(group!==currentGroup){

            currentGroup=group;

            html+=renderMonthHeader(
                event.month,
                event.year
            );

        }

        html+=renderCard(event);

    });

    container.innerHTML=html;
	
	bindCardDetailsEvents();

}

function bindCardDetailsEvents(){

    document
        .querySelectorAll(".card-toggle")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const card =
                        button.closest(".card");

                    const expanded =
                        card.classList.toggle("expanded");


                    button.textContent =
                        expanded
                        ? "Masquer les détails ▲"
                        : "Voir les détails ▼";

                }
            );

        });

}

</script>
