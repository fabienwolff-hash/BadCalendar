<script>
const DEBUG = {
    SIMULATE_INIT_ERROR: false
};

const Storage = {

    loadFiltersCollapsed() {
        return localStorage.getItem(STORAGE_KEYS.FILTERS_COLLAPSED) === "true";
    },

    saveFiltersCollapsed(value) {
        localStorage.setItem(STORAGE_KEYS.FILTERS_COLLAPSED,value);
    },

    loadShowFinished() {
        return localStorage.getItem(STORAGE_KEYS.SHOW_FINISHED) === "true";
    },

    saveShowFinished(value) {
        localStorage.setItem(STORAGE_KEYS.SHOW_FINISHED,value);
    },
		
	loadCategories() {

		const value = localStorage.getItem(STORAGE_KEYS.CATEGORIES);

		return value
			? JSON.parse(value)
			: [];
	},
	
	saveCategories(values) {
		localStorage.setItem(STORAGE_KEYS.CATEGORIES,JSON.stringify(values));
	},
	
	loadScopes() {

		const value = localStorage.getItem(STORAGE_KEYS.SCOPES);

		return value
			? JSON.parse(value)
			: [];
	},
	
	saveScopes(values) {
		localStorage.setItem(STORAGE_KEYS.SCOPES,JSON.stringify(values));
	},
	
};

const App = {

    events: [],

    state: {
		categories: [],
		scopes: [],
		types: [],
		showFinished: false,
		showNewOnly: false,
		filtersCollapsed: false
    },

    init(events) {

		document.body.classList.toggle(
			"mobile-device",
			window.screen.width < 600
		);

        this.events = events;
						
		this.initialize();
    },
	
	initialize() {

		this.restoreState();

		this.populateFilters();
		
		this.bindCategoryFilter();
		this.bindScopeFilter();
		this.bindTypeFilter();
		
		this.markNewEvents();

		this.bindEvents();
		
		this.render();
			
		this.showApplication();
	},
	
	restoreState() {
		this.state.filtersCollapsed =  Storage.loadFiltersCollapsed();
		this.state.showFinished = Storage.loadShowFinished();
		this.state.categories = Storage.loadCategories();
		this.state.scopes = Storage.loadScopes();
							
		$(DOM.SHOW_FINISHED).checked = this.state.showFinished;
	},
	
    populateFilters() {
		this.populateCategoryFilter();
		this.populateScopeFilter();
		this.populateTypeFilter();
    },
	
	populateCategoryFilter() {

		const container = $(DOM.FILTER_CATEGORIES);
		
		container.innerHTML = "";

		const categories =
			sortByOrder(
				[...new Set(
					this.events.flatMap(
						event => getCategories(event)
					)
				)],
				ORDER.CATEGORIES
			);

		categories.forEach(category => {

			const checked =
				this.state.categories.includes(category);

			container.innerHTML += `
				<label class="checkbox-label">

					<input
						type="checkbox"
						value="${category}"
						${checked ? "checked" : ""}>

					<span>${category}</span>

				</label>
			`;
		});
	},
	
	populateScopeFilter() {

		const container = $(DOM.FILTER_SCOPES);
		container.innerHTML = "";

		const scopes =
			sortByOrder(
				[...new Set(
					this.events.map(
						event => event.scope
					)
				)],
				ORDER.SCOPES
			);

		scopes.forEach(scope => {

			const checked =	this.state.scopes.includes(scope);

			container.innerHTML += `
				<label class="checkbox-label">

					<input
						type="checkbox"
						value="${scope}"
						${checked ? "checked" : ""}>

					<span>${scope}</span>

				</label>
			`;
		});
	},
	
	populateTypeFilter() {

		const container = $(DOM.FILTER_TYPES);
		container.innerHTML = "";

		const availableTypes = this.getAvailableTypes();

		availableTypes.forEach(type => {
			const checked =
				this.state.types.includes(type);

			container.innerHTML += `
				<label class="checkbox-label">

					<input
						type="checkbox"
						value="${type}"
						${checked ? "checked" : ""}>

					<span>${type}</span>

				</label>
			`;
		});
	},
	
	getAvailableTypes() {

		if (this.state.scopes.length === 0) {

			return [
				...new Set(
					this.events.map(event => event.type)
				)
			].sort();
		}

		return [
			...new Set(
				this.events
					.filter(event =>
						this.state.scopes.includes(
							event.scope
						)
					)
					.map(event => event.type)
			)
		].sort();
	},
	
	bindCategoryFilter() {
		document.querySelectorAll(
				"#filterCategories input[type='checkbox']"
			)
			.forEach(checkbox => {
				checkbox.addEventListener(
					"change",
					() => {
						this.state.categories =
							[...document.querySelectorAll(
								"#filterCategories input:checked"
							)]
							.map(input => input.value);

						Storage.saveCategories(this.state.categories);
						this.render();
					}
				);
			});
	},
	
	bindScopeFilter() {

		document.querySelectorAll(
				"#filterScopes input[type='checkbox']"
			)
			.forEach(checkbox => {
				checkbox.addEventListener(
					"change",
					() => {
						this.state.scopes =
							[...document.querySelectorAll(
								"#filterScopes input:checked"
							)]
							.map(
								input => input.value
							);

						Storage.saveScopes(this.state.scopes);
						const availableTypes = this.getAvailableTypes();

						this.state.types = this.state.types.filter(
								type =>	availableTypes.includes(type));
								
						this.populateTypeFilter();
						this.bindTypeFilter();
						
						this.render();
					}
				);
			});
	},
	
	bindTypeFilter() {

		document.querySelectorAll(
				"#filterTypes input[type='checkbox']"
			)
			.forEach(checkbox => {
				checkbox.addEventListener(
					"change",
					() => {
						this.state.types =
							[...document.querySelectorAll(
								"#filterTypes input:checked"
							)]
							.map(
								input => input.value
							);
						this.render();
					}
				);
			});
	},

    bindEvents() {
	
		$(DOM.FILTERS_TOGGLE)
			.addEventListener("click", () => {

				this.state.filtersCollapsed =
					!this.state.filtersCollapsed;

				Storage.saveFiltersCollapsed(this.state.filtersCollapsed);
				
				this.render();
			});
			
		$(DOM.SHOW_FINISHED)
			.addEventListener("change", e => {
				this.state.showFinished = e.target.checked;
				Storage.saveShowFinished(this.state.showFinished);

				this.render();
			});	
    },

    getFilteredEvents() {

        return this.events.filter(event => {

			if (this.state.types.length > 0 &&
				!this.state.types.includes(event.type)
			) {
				return false;
			}
	
			if (this.state.categories.length > 0 &&
				!this.state.categories.some(category =>	getCategories(event).includes(category))
			) {
				return false;
			}	
								
			if (this.state.scopes.length > 0 &&
				!this.state.scopes.includes(event.scope)
			){
				return false;
			}

			if (!this.state.showFinished &&
				event.tournamentStatus === STATUS.EVENT.FINISHED){
					return false;
				}


            return true;
        });
    },
	
	markNewEvents() {
		
		// Par défaut un tournoi est marqué nouveau pendant 30 jours par rapport à sa date de création
		const NEW_DURATION_DAYS = 30;
		
		this.events.forEach(event => {

			if (!event.creationDate) {
				event.isNew = false;
				return;
			}

			const creationDate = new Date(event.creationDate);
			const expirationDate = new Date(creationDate);
			
			expirationDate.setDate(expirationDate.getDate() + NEW_DURATION_DAYS);

			event.isNew = new Date() <= expirationDate;
		});
	},

	getFiltersSummary() {

		const summary = [];

		if (this.state.categories.length > 0) {
			summary.push(this.state.categories.join(", "));
		}
		
		if (this.state.types.length > 0) {
			summary.push(this.state.types.join(", "));
		}

		if (this.state.scopes.length > 0) {
			summary.push(this.state.scopes.join(", "));
		}

		return summary;

	},

   render(){
   
		this.updateFiltersUI();
   
		renderEvents(this.getFilteredEvents());
	},
	
	updateFiltersUI() {

		const filtersContent = $(DOM.FILTERS_CONTENT);
		const toggle = $(DOM.FILTERS_TOGGLE);

		filtersContent.classList.toggle(
			"collapsed",
			this.state.filtersCollapsed
		);

		toggle.setAttribute(
			"aria-expanded",
			String(!this.state.filtersCollapsed)
		);

		toggle.querySelector(".filters-toggle-icon").textContent =
			this.state.filtersCollapsed ? "▶" : "▼";

		const summary = this.getFiltersSummary();
		const summaryElement = $(DOM.FILTERS_SUMMARY);

		if (summary.length === 0) {
			summaryElement.textContent = UI.MESSAGES.NO_FILTER;
		} else {
			summaryElement.textContent = summary.join(" • ");
		}

		summaryElement.style.display =
			this.state.filtersCollapsed
				? "block"
				: "none";
	},
	
	
	resetFilters(){

		this.state.categories = [];
		this.state.types = [];
		this.state.scopes = [];

		document.querySelectorAll(
			"#filterCategories input[type='checkbox']")
				.forEach(input => {
					input.checked = false;
				});

		document.querySelectorAll(
			"#filterScopes input[type='checkbox']")
				.forEach(input => {
					input.checked = false;
				});
			
		document.querySelectorAll(
			"#filterTypes input[type='checkbox']")
				.forEach(input => {
					input.checked = false;
				});
		
		this.state.filtersCollapsed = false;
		
		this.state.showFinished = false;
		$(DOM.SHOW_FINISHED).checked = false;

		Storage.saveFiltersCollapsed(this.state.filtersCollapsed);
		Storage.saveShowFinished(this.state.showFinished);
		Storage.saveCategories([]);
		Storage.saveScopes([]);
		
		this.render();
	},
	
	showApplication(){
	
		$(DOM.LOADING)
			.classList.add("hidden");

		$(DOM.APP)
			.classList.remove("hidden");
	},
	
	showError(){
		$(DOM.LOADING)
			.classList.add("hidden");

		$(DOM.APP)
			.classList.add("hidden");

		$(DOM.ERROR)
			.classList.remove("hidden");
	},
	
	initError(error){
		this.showError();
	}
};

function sortByOrder(values, order){

    return [...values].sort((a, b) => {

        const ia = order.indexOf(a);
        const ib = order.indexOf(b);

        if(ia === -1 && ib === -1){
            return a.localeCompare(b);
        }

        if(ia === -1){
            return 1;
        }

        if(ib === -1){
            return -1;
        }

        return ia - ib;

    });

}



function $(id){
    return document.getElementById(id);
}
if (DEBUG.SIMULATE_INIT_ERROR) {

    App.initError(
        new Error("Erreur simulée")
    );

} else {
	google.script.run
		.withSuccessHandler(App.init.bind(App))
		.withFailureHandler(App.initError.bind(App))
		.readTournaments();
}
</script>
