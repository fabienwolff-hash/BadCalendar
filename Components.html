<script>

function renderCard(event) {

    if (event.tournamentStatus === STATUS.EVENT.FINISHED) {
        return renderFinishedCard(event);
    }
	
    const registrationInfo = getRegistrationMessage(event);
	
	let cardClass = "";

	if (event.tournamentStatus === STATUS.EVENT.FINISHED) {
		cardClass = "card-finished";
	}
	else if (event.tournamentStatus === STATUS.EVENT.ONGOING) {
		cardClass = "card-ongoing";
	}

    return `

<div class="card ${cardClass}">

	<div class="card-summary">
		<div class="card-header">
			<div class="card-header-left">
				<div class="title-row">

					<div class="badge ${event.type.toLowerCase()}">
						${event.type}
					</div>
					
					${event.isNew ? `
						<div class="badge-new">
							✨ Nouveau
						</div>
					` : ""}
					
					<h2 class="event-title">
						${event.title}
					</h2>
				</div>
			</div>
			
			<div class="event-date">
				${event.displayDate}
			</div>
		</div>
		
		<div class="info">
			📍 ${event.displayLocation}
			${
				getDisciplines(event).length > 0
					? ` • 🏸 ${getDisciplines(event).join(" • ")}`
					: ""
			}
		</div>

		<div class="info">
			👦 ${getCategories(event).join(" • ")}
		</div>

		${registrationInfo ? `
			<div class="registration">
				<span class="registration-dot ${getRegistrationClass(event)}"></span>
				${registrationInfo}
			</div>
		` : ""}
			
		<button 
			class="card-toggle"
			type="button">

			▼ Voir les détails
		</button>


	</div>
	<div class="card-details">

		<div class="info">
			👥 ${event.registration.mode}
		</div>
		
		${eventButton(event)}

		<div class="secondary-actions">

			${googleMapsButton(event)}

			${googleCalendarButton(event)}

		</div>
	</div>
</div>

`;

}

function renderFinishedCard(event) {

    const button = eventButton(event);

    return `

<div class="card card-finished">
    <div class="card-summary">
        <div class="card-header">
            <div class="card-header-left">
                <div class="title-row">
                    <div class="badge ${event.type.toLowerCase()}">
                        ${event.type}
                    </div>

                    <h2 class="event-title">
                        ${event.title}
                    </h2>
                </div>
            </div>
            <div class="event-date">
                ${event.displayDate}
            </div>
        </div>

        <div class="info">
            📍 ${event.displayLocation}
        </div>

        <div class="info">
            👶 ${getCategories(event).join(" • ")}
        </div>

        ${button}
    </div>
</div>
`;
}

function renderMonthHeader(month, year){

    return `

<h2 class="month-header">

${month.charAt(0).toUpperCase()+month.slice(1)} ${year}

</h2>

`;

}

function renderEvents(events){

    const container=document.getElementById("events");
	
	if (events.length === 0) {

    container.innerHTML = `
        <div class="empty">
            <p>${UI.MESSAGES.EMPTY}</p>

            <button
                id="resetFilters"
                class="button"
                type="button">

                ${UI.BUTTONS.RESET_FILTERS}

            </button>
        </div>
    `;

    document
        .getElementById("resetFilters")
        .addEventListener("click", () => App.resetFilters());

    return;
	}

    let html="";

    let currentGroup="";

    events.forEach(event=>{

        const group=event.year+"-"+event.monthNumber;

        if(group!==currentGroup){

            currentGroup=group;

            html+=renderMonthHeader(
                event.month,
                event.year
            );

        }

        html+=renderCard(event);

    });

    container.innerHTML=html;
	
	bindCardDetailsEvents();

}

function bindCardDetailsEvents(){

    document
        .querySelectorAll(".card-toggle")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const card =
                        button.closest(".card");

                    const expanded =
                        card.classList.toggle("expanded");


                    button.textContent =
						expanded
						? "▲ Masquer les détails"
						: "▼ Voir les détails";

                }
            );

        });

}

</script>
