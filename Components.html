<script>

function renderCard(event) {

  return `

<div class="card">

    <div class="badge ${event.type.toLowerCase()}">
        ${event.type}
    </div>

    <h2>${event.title}</h2>

    <div class="info">
        📅 ${formatDate(event.startDate, event.endDate)}
    </div>

    <div class="info">
        📍 ${event.location}
    </div>

    <div class="info">
        👦 ${event.category}
    </div>

    <div class="info">
        📝 ${event.registrationType}
    </div>

    ${registrationButton(event)}

</div>

`;

}

function renderMonthHeader(month, year){

    return `

<h2 class="month-header">

${month.charAt(0).toUpperCase()+month.slice(1)} ${year}

</h2>

`;

}

function renderEvents(events){

    const container =
        document.getElementById("events");

    let html = "";

    let currentGroup = "";

    events.forEach(event=>{

        const group =
            event.year + "-" + event.monthNumber;

        if(group !== currentGroup){

            currentGroup = group;

            html += renderMonthHeader(
                event.month,
                event.year
            );

        }

        html += renderCard(event);

    });

    container.innerHTML = html;

}

</script>
