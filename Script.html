<script>

const App = {

    events: [],

    state: {
        search: "",
		type: UI.FILTERS.ALL,
		category: UI.FILTERS.ALL,
		scope: UI.FILTERS.ALL,
		month: UI.FILTERS.ALL,
		filtersCollapsed: false
    },

    init(events) {

        console.time("Frontend initialization");
		
		this.events = events;
		
		console.log("Events chargés :", this.events);
		
		    console.table(
        this.events.map(e => ({
            title: e.title,
            eventStatus: e.eventStatus,
            registrationStatus: e.registrationStatus
        }))
    );

        this.populateFilters();
		
		const collapsed = localStorage.getItem("badcalendar.filtersCollapsed");

		if (collapsed !== null) {
			this.state.filtersCollapsed = collapsed === "true";
		}

        this.bindEvents();

        this.render();
		
		this.showApplication();
		
		console.timeEnd("Frontend initialization");

    },

    populateFilters() {

        fillSelect(
            DOM.FILTER_TYPE,
            [...new Set(this.events.map(e => e.type))].sort()
        );

		fillSelect(
			DOM.FILTER_CATEGORY,sortByOrder(
			[...new Set(this.events.flatMap(e => e.categoriesArray))],
			ORDER.CATEGORIES)
		);
		
		fillSelect(
			DOM.FILTER_SCOPE,sortByOrder(
			[...new Set(this.events.map(e => e.scope))],
			ORDER.SCOPES)
		);

		fillSelect(
			DOM.FILTER_MONTH,
			[...new Set(this.events.map(e => e.month))]
		);

    },

    bindEvents() {

       $(DOM.SEARCH)
            .addEventListener("input", e => {
                this.state.search = e.target.value;
                this.render();
            });

        $(DOM.FILTER_TYPE)
            .addEventListener("change", e => {
                this.state.type = e.target.value;
                this.render();
            });

        $(DOM.FILTER_CATEGORY)
            .addEventListener("change", e => {
                this.state.category = e.target.value;
                this.render();
            });
			
		$(DOM.FILTER_SCOPE)
			.addEventListener("change", e => {
				this.state.scope = e.target.value;
				this.render();
			});	

        $(DOM.FILTER_MONTH)
            .addEventListener("change", e => {
                this.state.month = e.target.value;
                this.render();
            });

		$(DOM.FILTERS_TOGGLE)
			.addEventListener("click", () => {

				this.state.filtersCollapsed =
					!this.state.filtersCollapsed;

				localStorage.setItem(
					"badcalendar.filtersCollapsed",
					this.state.filtersCollapsed
				);
				
				this.render();
			});
    },

    getFilteredEvents() {

        return this.events.filter(event => {

            if (this.state.type !== UI.FILTERS.ALL
                && event.type !== this.state.type)
                return false;

            if (this.state.category !== UI.FILTERS.ALL 
				&& !event.categoriesArray.includes(this.state.category))
				return false;
				
			if (this.state.scope !== UI.FILTERS.ALL &&
				event.scope !== this.state.scope){
					return false;
				}

			if (this.state.month !== UI.FILTERS.ALL &&
				event.month !== this.state.month)
					return false;

            if (this.state.search !== "") {
                const txt = (
                    event.title +
                    " " +
                    event.location +
                    " " +
                    event.categories +
						" " +
                    event.type
                ).toLowerCase();

                if (!txt.includes(
                    this.state.search.toLowerCase()
                )) {
                    return false;
                }
            }
            return true;
        });
    },

	getFiltersSummary() {

		const summary = [];

		if (this.state.search !== "") {
			summary.push(`Recherche : ${this.state.search}`);
		}

		if (this.state.type !== UI.FILTERS.ALL) {
			summary.push(this.state.type);
		}

		if (this.state.scope !== UI.FILTERS.ALL) {
			summary.push(this.state.scope);
		}

		if (this.state.category !== UI.FILTERS.ALL) {
			summary.push(this.state.category);
		}

		if (this.state.month !== UI.FILTERS.ALL) {
			summary.push(this.state.month);
		}

		return summary;

	},

   render(){
    console.time("render");
    const filtersContent = $(DOM.FILTERS_CONTENT);
    const toggle = $(DOM.FILTERS_TOGGLE);

    filtersContent.classList.toggle(
        "collapsed",
        this.state.filtersCollapsed
    );

	toggle.setAttribute(
		"aria-expanded",
		String(!this.state.filtersCollapsed)
	);

    toggle.querySelector(".filters-toggle-icon").textContent =
        this.state.filtersCollapsed ? "▶" : "▼";
   
   const summary = this.getFiltersSummary();
	const summaryElement = $(DOM.FILTERS_SUMMARY);

	if (summary.length === 0) {
		summaryElement.textContent = "Aucun filtre actif";
	} else {
		summaryElement.textContent = summary.join(" • ");
	}
	
	summaryElement.style.display =
    this.state.filtersCollapsed
        ? "block"
        : "none";
   
    renderEvents(this.getFilteredEvents());
	console.timeEnd("render");
	},
	
	showApplication(){
		$(DOM.LOADING)
			.classList.add("hidden");

		$(DOM.APP)
			.classList.remove("hidden");
		}
};

function fillSelect(id, values) {
    const select = document.getElementById(id);
    select.innerHTML = `<option>${UI.FILTERS.ALL}</option>`;
    values.forEach(value => {
        select.innerHTML +=
            `<option>${value}</option>`;
    });
}

function sortByOrder(values, order){

    return [...values].sort((a, b) => {

        const ia = order.indexOf(a);
        const ib = order.indexOf(b);

        if(ia === -1 && ib === -1){
            return a.localeCompare(b);
        }

        if(ia === -1){
            return 1;
        }

        if(ib === -1){
            return -1;
        }

        return ia - ib;

    });

}

function $(id){
    return document.getElementById(id);
}

console.time("readEvents");

google.script.run

    .withSuccessHandler(events => {

        console.timeEnd("readEvents");

        App.init(events);

    })

    .readEvents();

</script>
