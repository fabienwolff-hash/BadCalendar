<script>

function renderCard(event) {

    const registrationInfo = getRegistrationMessage(event);

    return `

<div class="card ${event.eventStatus === STATUS.EVENT.FINISHED ? "card-finished" : ""}">

    <div class="card-header">

        <div class="badge ${event.type.toLowerCase()}">
            ${event.type}
        </div>

        <div class="event-date">
            ${shortDate(event.startDate)}
        </div>

    </div>

    <h2 class="event-title">
        ${event.title}
    </h2>

    <div class="info">
        📍 ${event.location}
    </div>

    <div class="info">
        👦 ${event.categoriesArray.join(" • ")}
    </div>

    <div class="separator"></div>

    <div class="info">
        👥 ${event.registrationMode}
    </div>

    ${registrationInfo ? `
    <div class="registration">
        📝 ${registrationInfo}
    </div>
    ` : ""}

    ${eventButton(event)}

</div>

`;

}

function renderMonthHeader(month, year){

    return `

<h2 class="month-header">

${month.charAt(0).toUpperCase()+month.slice(1)} ${year}

</h2>

`;

}

function renderEvents(events){

    const container=document.getElementById("events");
	
	if (events.length === 0) {

    container.innerHTML = `
        <div class="empty">
            <p>${UI.MESSAGES.EMPTY}</p>

            <button
                id="resetFilters"
                class="button"
                type="button">

                ${UI.BUTTONS.RESET_FILTERS}

            </button>
        </div>
    `;

    document
        .getElementById("resetFilters")
        .addEventListener("click", () => App.resetFilters());

    return;
	}

    let html="";

    let currentGroup="";

    events.forEach(event=>{

        const group=event.year+"-"+event.monthNumber;

        if(group!==currentGroup){

            currentGroup=group;

            html+=renderMonthHeader(
                event.month,
                event.year
            );

        }

        html+=renderCard(event);

    });

    container.innerHTML=html;

}

</script>
