<script>

function eventStatusLabel(status){

    switch(status){

        case "UPCOMING":
            return "📅 À venir";

        case "ONGOING":
            return "🟢 En cours";

        case "FINISHED":
            return "✔ Terminé";

        default:
            return "";
    }

}

function registrationStatusLabel(status){

    switch(status){

        case "OPEN":
            return "📝 Inscriptions ouvertes";

        case "NOT_OPEN":
            return "📝 Inscriptions bientôt ouvertes";

        case "CLOSED":
            return "📝 Inscriptions clôturées";

        case "UNKNOWN":
            return "📝 Inscriptions à venir";

        default:
            return "";
    }

}

function renderCard(event) {

  return `

<div class="card">

    <div class="card-header">

        <div class="badge ${event.type.toLowerCase()}">
            ${event.type}
        </div>

        <div class="event-date">
            ${shortDate(event.startDate)}
        </div>

    </div>

    <h2 class="event-title">
        ${event.title}
    </h2>

    <div class="info">
        📍 ${event.location}
    </div>

    <div class="info">
        👦 ${event.categories}
    </div>

    <div class="separator"></div>

    <div class="registration">

        📝 ${registrationStatusLabel(event.registrationStatus)}

    </div>

	<div class="info">${eventStatusLabel(event.eventStatus)}</div>

    ${registrationButton(event)}

</div>

`;

}

function renderMonthHeader(month, year){

    return `

<h2 class="month-header">

${month.charAt(0).toUpperCase()+month.slice(1)} ${year}

</h2>

`;

}

function renderEvents(events){

    const container=document.getElementById("events");

    let html="";

    let currentGroup="";

    events.forEach(event=>{

        const group=event.year+"-"+event.monthNumber;

        if(group!==currentGroup){

            currentGroup=group;

            html+=renderMonthHeader(
                event.month,
                event.year
            );

        }

        html+=renderCard(event);

    });

    container.innerHTML=html;

}

</script>
