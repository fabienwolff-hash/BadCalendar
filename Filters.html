<script>

function initFilters(app){

    populateFilters(app);

    bindFilters(app);

}

function populateFilters(app){

    const types = [...new Set(app.events.map(e => e.type))].sort();

    const categories = [...new Set(
        app.events.flatMap(e => e.categories || [])
    )].sort();

    const months = [...new Set(
        app.events.map(e => `${e.month} ${e.year}`)
    )];

    fillSelect("filterType", types);
    fillSelect("filterCategory", categories);
    fillSelect("filterMonth", months);

}

function bindFilters(app){

    document.getElementById("search").addEventListener("input", e => {

        app.filters.search = e.target.value;

        app.render();

    });

    document.getElementById("filterType").addEventListener("change", e => {

        app.filters.type = e.target.value;

        app.render();

    });

    document.getElementById("filterCategory").addEventListener("change", e => {

        app.filters.category = e.target.value;

        app.render();

    });

    document.getElementById("filterMonth").addEventListener("change", e => {

        app.filters.month = e.target.value;

        app.render();

    });

}

function getFilteredEvents(app){

    return app.events.filter(event => {

        if(app.filters.type !== "Tous"){

            if(event.type !== app.filters.type){

                return false;

            }

        }

        if(app.filters.category !== "Tous"){

            if(!event.categories.includes(app.filters.category)){

                return false;

            }

        }

        if(app.filters.month !== "Tous"){

            const month = `${event.month} ${event.year}`;

            if(month !== app.filters.month){

                return false;

            }

        }

        if(app.filters.search.trim() !== ""){

            const search = app.filters.search.toLowerCase();

            const text = (

                event.title + " " +
                event.location + " " +
                event.category + " " +
                event.type

            ).toLowerCase();

            if(!text.includes(search)){

                return false;

            }

        }

        return true;

    });

}

function fillSelect(id, values){

    const select = document.getElementById(id);

    select.innerHTML = "<option>Tous</option>";

    values.forEach(value => {

        select.innerHTML += `<option>${value}</option>`;

    });

}

</script>
