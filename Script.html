<script>

const UI = {

    FILTERS: {
        ALL: "Tous"
    },

    BUTTONS: {
        REGISTER: "S'inscrire",
        VIEW_EVENT: "Voir l'événement",
        VIEW_RESULTS: "Voir les résultats"
    },

    STATUS: {
        UPCOMING: "À venir",
        PAST: "Terminé",
        REGISTRATION_OPEN: "Inscriptions ouvertes",
        REGISTRATION_CLOSED: "Inscriptions fermées",
        REGISTRATION_NOT_OPEN: "Inscriptions non ouvertes"
    },

    MESSAGES: {
        EMPTY: "Aucun événement trouvé."
    }

};
const DOM = {
    SEARCH: "search",
    FILTER_TYPE: "filterType",
    FILTER_CATEGORY: "filterCategory",
	FILTER_SCOPE: "filterScope",
    FILTER_MONTH: "filterMonth",
    EVENTS: "events"
};

const App = {

    events: [],

    state: {
        search: "",
		type: UI.FILTERS.ALL,
		category: UI.FILTERS.ALL,
		scope: UI.FILTERS.ALL,
		month: UI.FILTERS.ALL
    },

    init(events) {

        this.events = events;
		
		console.log("Events chargés :", this.events);
		
		    console.table(
        this.events.map(e => ({
            title: e.title,
            eventStatus: e.eventStatus,
            registrationStatus: e.registrationStatus
        }))
    );

        this.populateFilters();

        this.bindEvents();

        this.render();

    },

    populateFilters() {

        fillSelect(
            DOM.FILTER_TYPE,
            [...new Set(this.events.map(e => e.type))].sort()
        );

		fillSelect(
			DOM.FILTER_CATEGORY,
			[...new Set(this.events.flatMap(e => e.categoriesArray))].sort()
		);
		
		fillSelect(
			DOM.FILTER_SCOPE,
			[...new Set(this.events.map(e => e.scope))].sort()
		);

		fillSelect(
			DOM.FILTER_MONTH,
			[...new Set(this.events.map(e => e.month))]
		);

    },

    bindEvents() {

       $(DOM.SEARCH)
            .addEventListener("input", e => {
                this.state.search = e.target.value;
                this.render();
            });

        $(DOM.FILTER_TYPE)
            .addEventListener("change", e => {
                this.state.type = e.target.value;
                this.render();
            });

        $(DOM.FILTER_CATEGORY)
            .addEventListener("change", e => {
                this.state.category = e.target.value;
                this.render();
            });
			
		$(DOM.FILTER_SCOPE)
			.addEventListener("change", e => {
				this.state.scope = e.target.value;
				this.render();
			});	

        $(DOM.FILTER_MONTH)
            .addEventListener("change", e => {
                this.state.month = e.target.value;
                this.render();
            });

    },

    getFilteredEvents() {

        return this.events.filter(event => {

            if (this.state.type !== UI.FILTERS.ALL
                && event.type !== this.state.type)
                return false;

            if (this.state.category !== UI.FILTERS.ALL 
				&& !event.categoriesArray.includes(this.state.category))
				return false;
				
			if (this.state.scope !== UI.FILTERS.ALL &&
				event.scope !== this.state.scope){
					return false;
				}

			if (this.state.month !== UI.FILTERS.ALL &&
				event.month !== this.state.month)
					return false;

            if (this.state.search !== "") {
                const txt = (
                    event.title +
                    " " +
                    event.location +
                    " " +
                    event.categories +
						" " +
                    event.type
                ).toLowerCase();

                if (!txt.includes(
                    this.state.search.toLowerCase()
                )) {
                    return false;
                }
            }
            return true;
        });
    },

   render(){
    renderEvents(this.getFilteredEvents());
	}

};

function fillSelect(id, values) {
    const select = document.getElementById(id);
    select.innerHTML = `<option>${UI.FILTERS.ALL}</option>`;
    values.forEach(value => {
        select.innerHTML +=
            `<option>${value}</option>`;
    });
}

function $(id){
    return document.getElementById(id);
}

google.script.run

    .withSuccessHandler(App.init.bind(App))

    .readEvents();

</script>
