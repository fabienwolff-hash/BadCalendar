<script>
  function renderCard(event) {
    if (event.tournamentStatus === STATUS.EVENT.FINISHED) {
      return renderFinishedCard(event);
    }

    const registrationInfo = getRegistrationMessage(event);

    let cardClass = "";

    if (event.tournamentStatus === STATUS.EVENT.FINISHED) {
      cardClass = "card-finished";
    } else if (event.tournamentStatus === STATUS.EVENT.ONGOING) {
      cardClass = "card-ongoing";
    }

    return `

<div class="card ${cardClass}">

	<div class="card-summary">
		<div class="card-header">
			<div class="card-header-left">
				<div class="title-row">

					<div class="badge ${event.type.toLowerCase()}">
						${event.type}
					</div>
					
					${
            event.isNew
              ? `
						<div class="badge-new">
							✨ Nouveau
						</div>
					`
              : ""
          }
					
					<h2 class="event-title">
						${event.title}
					</h2>
				</div>
			</div>
			
			<div class="event-date">
				${event.displayDate}
			</div>
		</div>
		
		<div class="info">
			📍 ${event.displayLocation}
			${getDisciplines(event).length > 0 ? ` • 🏸 ${getDisciplines(event).join(" • ")}` : ""}
		</div>

		<div class="info">
			👦 ${getCategories(event).join(" • ")}
		</div>

		${
      registrationInfo
        ? `
			<div class="registration">
				<span class="registration-dot ${getRegistrationClass(event)}"></span>
				${registrationInfo}
			</div>
		`
        : ""
    }
			
		<button 
			class="card-toggle"
			type="button">

			▼ Voir les actions
		</button>


	</div>
	<div class="card-details">

		${getProgramSiteDetails(event)}

		${eventButton(event)}

		<div class="secondary-actions">

			${googleMapsButton(event)}

			${googleCalendarButton(event)}

		</div>
	</div>
</div>

`;
  }

  function renderFinishedCard(event) {
    const button = eventButton(event);

    return `

<div class="card card-finished">
    <div class="card-summary">
        <div class="card-header">
            <div class="card-header-left">
                <div class="title-row">
                    <div class="badge ${event.type.toLowerCase()}">
                        ${event.type}
                    </div>

                    <h2 class="event-title">
                        ${event.title}
                    </h2>
                </div>
            </div>
            <div class="event-date">
                ${event.displayDate}
            </div>
        </div>

        <div class="info">
            📍 ${event.displayLocation}
        </div>

        <div class="info">
            👶 ${getCategories(event).join(" • ")}
        </div>

        ${button}
    </div>
</div>
`;
  }

  function renderMonthHeader(month, year) {
    return `

<h2 class="month-header">

${month.charAt(0).toUpperCase() + month.slice(1)} ${year}

</h2>

`;
  }

  function renderEvents(events) {
    const container = document.getElementById("events");

    if (events.length === 0) {
      renderEmptyResults(container);
      return;
    }

    let html = "";

    let currentGroup = "";

    events.forEach((event) => {
      const group = event.year + "-" + event.monthNumber;

      if (group !== currentGroup) {
        currentGroup = group;

        html += renderMonthHeader(event.month, event.year);
      }

      html += renderCard(event);
    });

    container.innerHTML = html;

    bindCardDetailsEvents();
    bindUsageMetricEvents();
  }

  function bindCardDetailsEvents() {
    document.querySelectorAll(".card-toggle").forEach((button) => {
      button.addEventListener("click", () => {
        const card = button.closest(".card");
        const expanded = card.classList.toggle("expanded");

        if (expanded) {
          UsageMetricService.track(USAGE_METRICS.CARD_EXPAND);
        }

        button.textContent = expanded ? "▲ Masquer les actions" : "▼ Voir les actions";
      });
    });
  }

  function bindUsageMetricEvents() {
    document.querySelectorAll(".badnet-link").forEach((link) => {
      link.addEventListener("click", () => {
        UsageMetricService.track(USAGE_METRICS.BADNET_OPEN);
      });
    });

    document.querySelectorAll(".maps-link").forEach((link) => {
      link.addEventListener("click", () => {
        UsageMetricService.track(USAGE_METRICS.MAPS_OPEN);
      });
    });

    document.querySelectorAll(".calendar-link").forEach((link) => {
      link.addEventListener("click", () => {
        UsageMetricService.track(USAGE_METRICS.CALENDAR_EXPORT);
      });
    });
  }

  function renderEmptyResults(container) {
    container.innerHTML = `
    <div class="empty">
      <p>${UI.MESSAGES.EMPTY}</p>

      <button
        id="resetFilters"
        class="button"
        type="button">
        ${UI.BUTTONS.RESET_FILTERS}
      </button>
    </div>
  `;

    document.getElementById("resetFilters").addEventListener("click", () => App.resetFilters());
  }

  function renderSeasonEvent(event) {
    const icon = event.type === "Stage" ? "🎓" : "🏸";

    return `
    <div class="season-event">
      ${icon} ${event.title}
    </div>
  `;
  }

  function renderSeasonMonth(month, year, events) {
    const occupancy = buildMonthOccupancy(events);

    return `
    <div class="season-month-card">

	<div class="season-header">

	  <h2>
		📅 ${month.charAt(0).toUpperCase() + month.slice(1)} ${year}
	  </h2>

	  <div class="season-legend">
		<span class="legend-item">
		  <span class="season-dot occupied"></span>
		  Occupé
		</span>

		<span class="legend-item">
		  <span class="season-dot"></span>
		  Libre
		</span>
	  </div>

	</div>

      ${renderOccupancyIndicators(occupancy, year, events[0].monthNumber)}

      <div class="season-events-list">
        ${events.map(renderSeasonEvent).join("")}
      </div>

    </div>
  `;
  }

  function renderSeasonView(events) {
    const container = document.getElementById("seasonView");

    if (events.length === 0) {
      renderEmptyResults(container);
      return;
    }

    let html = "";

    let currentGroup = "";
    let currentEvents = [];

    events.forEach((event, index) => {
      const group = event.year + "-" + event.monthNumber;

      if (currentGroup === "") {
        currentGroup = group;
      }

      if (group !== currentGroup) {
        html += renderSeasonMonth(currentEvents[0].month, currentEvents[0].year, currentEvents);

        currentEvents = [];
        currentGroup = group;
      }

      currentEvents.push(event);

      const isLast = index === events.length - 1;

      if (isLast) {
        html += renderSeasonMonth(currentEvents[0].month, currentEvents[0].year, currentEvents);
      }
    });

    container.innerHTML = html;
  }

  function buildMonthOccupancy(events) {
    const occupancy = [false, false, false, false, false];

    events.forEach((event) => {
      const startDate = new Date(event.startDate);

      const dayOfMonth = startDate.getDate();

      const weekIndex = Math.min(Math.floor((dayOfMonth - 1) / 7), 4);

      occupancy[weekIndex] = true;
    });

    return occupancy;
  }

  function buildWeekLabels(year, monthNumber) {
    const lastDay = new Date(year, monthNumber, 0).getDate();

    const labels = [];

    for (let startDay = 1; startDay <= lastDay; startDay += 7) {
      const endDay = Math.min(startDay + 6, lastDay);

      labels.push(`${String(startDay).padStart(2, "0")}-${String(endDay).padStart(2, "0")}`);
    }

    return labels;
  }

  function renderOccupancyIndicators(occupancy, year, monthNumber) {
    const labels = buildWeekLabels(year, monthNumber);

    return `
    <div class="season-indicator">
      ${occupancy
        .map(
          (occupied, index) => `
            <div class="season-slot">

              <span
                class="season-dot ${occupied ? "occupied" : ""}">
              </span>

              <small>${labels[index]}</small>

            </div>
          `
        )
        .join("")}
    </div>
  `;
  }
</script>
