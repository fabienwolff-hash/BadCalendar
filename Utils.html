<script>

const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function eventButton(event){

    if(!event.eventUrl){
        return "";
    }

    let label;

    switch(event.tournamentStatus){
        case STATUS.EVENT.FINISHED:
            label = UI.BUTTONS.VIEW_RESULTS;
            break;

        default:

            switch(event.registrationStatus){
                case STATUS.REGISTRATION.OPEN:
                    label = UI.BUTTONS.REGISTER;
                    break;

                default:
                    label = UI.BUTTONS.VIEW_EVENT;
            }
    }
	
    return `
        <a
            class="button button-primary"
            href="${event.eventUrl}"
            target="_blank"
        >
            ${label}
        </a>
    `;
}

function googleMapsButton(event) {

    const links = getGoogleMapsLinks(event);

    if (links.length === 0) {
        return "";
    }

    if (links.length === 1) {

        return `
			<a
				class="secondary-link"
				href="${links[0].url}"
				target="_blank"
				rel="noopener noreferrer">
				${UI.BUTTONS.GOOGLE_MAPS}
			</a>
			`;
    }

    return links.map(link => `
		<a
			class="secondary-link"
			href="${link.url}"
			target="_blank"
			rel="noopener noreferrer">
			📍 ${link.city}
		</a>
		`).join("");
}

function googleCalendarButton(event) {

    if (!event.googleCalendarUrl) {
        return "";
    }
    return `
        <a
            class="secondary-link"
            href="${event.googleCalendarUrl}"
            target="_blank"
            rel="noopener noreferrer">
            ${UI.BUTTONS.GOOGLE_CALENDAR}
        </a>
    `;
}

function getRegistrationMessage(event){

    switch (event.registrationStatus) {

    case STATUS.REGISTRATION.UNKNOWN:
        return "";

    case STATUS.REGISTRATION.NOT_OPEN:
        return event.registration.openDate
            ? `${UI.STATUS.REGISTRATION_NOT_OPEN} ${shortDate(event.registration.openDate)}`
            : UI.STATUS.REGISTRATION_NOT_OPEN;

    case STATUS.REGISTRATION.OPEN:
        return event.registration.closeDate
            ? `${UI.STATUS.REGISTRATION_OPEN} ${shortDate(event.registration.closeDate)}`
            : UI.STATUS.REGISTRATION_OPEN;

    case STATUS.REGISTRATION.CLOSED:
        return UI.STATUS.REGISTRATION_CLOSED;

    default:
        return "";
    }
}

function getRegistrationClass(event) {

    switch (event.registrationStatus) {

        case STATUS.REGISTRATION.OPEN:
            return "registration-open";

        case STATUS.REGISTRATION.NOT_OPEN:
            return "registration-not-open";

        case STATUS.REGISTRATION.CLOSED:
            return "registration-closed";

        default:
            return "";
    }
}

function shortDate(date){

    const d=new Date(date);

    return d.toLocaleDateString(
        "fr-FR",
        {
            day:"numeric",
            month:"short"
        }
    );
}

function getCategories(event) {

    const categories = new Set();

    event.programs.forEach(program => {

        program.categories.forEach(category => {
            categories.add(category);
        });

    });

    return sortByOrder(
		[...categories],
		ORDER.CATEGORIES
	);
}

function getDisciplines(event) {

    const disciplines = new Set();

    event.programs.forEach(program => {

        program.disciplines.forEach(discipline => {
            disciplines.add(discipline);
        });

    });

    return [...disciplines];
}

function getSites(event) {

    const sites = [];
    const seen = new Set();

    event.programs.forEach(program => {

        program.sites.forEach(site => {

            const key = [
                site.region || "",
                site.department || "",
                site.city || "",
                site.gymnasium || ""
            ].join("|");

            if (!seen.has(key)) {
                seen.add(key);
                sites.push(site);
            }
        });
    });

    return sites;
}

function getSiteCount(event) {
    return getSites(event).length;
}

function getGoogleMapsLinks(event) {

    return getSites(event)
        .filter(site => site.googleMapsUrl)
        .map(site => ({
            city: site.city,
            gymnasium: site.gymnasium,
            url: site.googleMapsUrl
        }));
}

</script>
