<script>

const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function formatDate(start,end){

  const d1 = start ? new Date(start) : null;
  const d2 = end ? new Date(end) : null;

  if(!d1 || isNaN(d1)) return "Date invalide";

  if(!d2 || isNaN(d2)){
    return `${d1.getDate()} ${MONTHS[d1.getMonth()]}`;
  }

  if(d1.getTime() === d2.getTime()){
    return `${d1.getDate()} ${MONTHS[d1.getMonth()]}`;
  }

  if(d1.getMonth() === d2.getMonth()){
    return `${d1.getDate()} → ${d2.getDate()} ${MONTHS[d1.getMonth()]}`;
  }

  return `${d1.getDate()} ${MONTHS[d1.getMonth()]} → ${d2.getDate()} ${MONTHS[d2.getMonth()]}`;

}

function eventButton(event){

    if(!event.eventUrl){
        return "";
    }

    let label;

    switch(event.eventStatus){

        case CONFIG.STATUS.EVENT.FINISHED:
            label = UI.BUTTONS.VIEW_RESULTS;
            break;

        default:

            switch(event.registrationStatus){

                case STATUS.REGISTRATION.OPEN:
                    label = UI.BUTTONS.REGISTER;
                    break;

                default:
                    label = UI.BUTTONS.VIEW_EVENT;

            }

    }

    return `
        <a
            class="button"
            href="${event.eventUrl}"
            target="_blank"
        >
            ${label}
        </a>
    `;

}

function getRegistrationMessage(event){

    switch (event.registrationStatus) {

    case CONFIG.STATUS.REGISTRATION.UNKNOWN:
        return "";

    case CONFIG.STATUS.REGISTRATION.NOT_OPEN:
        return event.registrationOpenDate
            ? `${UI.STATUS.REGISTRATION_NOT_OPEN} ${shortDate(event.registrationOpenDate)}`
            : UI.STATUS.REGISTRATION_NOT_OPEN;

    case CONFIG.STATUS.REGISTRATION.OPEN:
        return event.registrationCloseDate
            ? `${UI.STATUS.REGISTRATION_OPEN} ${shortDate(event.registrationCloseDate)}`
            : UI.STATUS.REGISTRATION_OPEN;

    case CONFIG.STATUS.REGISTRATION.CLOSED:
        return UI.STATUS.REGISTRATION_CLOSED;

    default:
        return "";

}

}

function shortDate(date){

    const d=new Date(date);

    return d.toLocaleDateString(
        "fr-FR",
        {
            day:"numeric",
            month:"short"
        }
    );
}

</script>
